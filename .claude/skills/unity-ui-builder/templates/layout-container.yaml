# A pure row/column container — no CanvasRenderer, no visuals of its own,
# just positions its children. Swap the guid on the layout component to
# 59f8146938fff824cb5fd77236b75775 for a VerticalLayoutGroup instead of
# HorizontalLayoutGroup (30649d3a9faa99c48a7b1166b86bf2a0). Drop the
# ContentSizeFitter block if the container should keep a fixed size instead
# of shrinking/growing to fit its children.
#
# m_ChildControlWidth/Height: 0 means children keep their own size (from their
# own RectTransform.sizeDelta or a LayoutElement) and the group only
# positions them — set to 1 if you want the group to force children to fill
# available space instead.

--- !u!1 &{FILEID_GAMEOBJECT}
GameObject:
  m_ObjectHideFlags: 0
  m_CorrespondingSourceObject: {fileID: 0}
  m_PrefabInstance: {fileID: 0}
  m_PrefabAsset: {fileID: 0}
  serializedVersion: 6
  m_Component:
  - component: {fileID: {FILEID_RECTTRANSFORM}}
  - component: {fileID: {FILEID_LAYOUTGROUP}}
  - component: {fileID: {FILEID_CONTENTSIZEFITTER}}
  m_Layer: 5
  m_Name: {NAME}
  m_TagString: Untagged
  m_Icon: {fileID: 0}
  m_NavMeshLayer: 0
  m_StaticEditorFlags: 0
  m_IsActive: 1
--- !u!224 &{FILEID_RECTTRANSFORM}
